# Render Blueprint — one-click deploy for the Huemot contact API.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: huemot-contact-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: TO_EMAIL
        value: info@huemot.com
      - key: FROM_EMAIL
        value: "Huemot Website <noreply@huemot.com>"
      # Secret — set in the Render dashboard (sync:false keeps it out of git).
      # Resend API key; huemot.com is a verified Resend sending domain.
      - key: RESEND_API_KEY
        sync: false
